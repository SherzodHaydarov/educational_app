<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Educational Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', path='css/styles.css') }}" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">EduCenter</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/students' %}active{% endif %}" href="/students">Students</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/courses' %}active{% endif %}" href="/courses">Courses</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/payments' %}active{% endif %}" href="/payments">Payments</a>
          </li>
        </ul>

        <div style="display:flex;align-items:center;gap:8px;">
          <button onclick="toggleTheme()" id="theme-btn">
            <span id="theme-icon">🌙</span> <span id="theme-text">Tungi rejim</span>
          </button>

          <a href="/logout" style="
            display:inline-flex;align-items:center;gap:6px;
            padding:5px 12px;
            border-radius:6px;
            border:1px solid rgba(239,68,68,0.3);
            background:transparent;
            color:#f87171;
            font-size:12px;font-weight:500;
            text-decoration:none;
            transition:all 0.2s;
          " onmouseover="this.style.background='rgba(239,68,68,0.1)'"
             onmouseout="this.style.background='transparent'">
            ⎋ Chiqish
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function applyTheme(dark) {
      if (dark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-text').textContent = 'Kunduzgi';
      } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-text').textContent = 'Tungi rejim';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      applyTheme(!isDark);
    }

    applyTheme(localStorage.getItem('theme') === 'dark');
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
