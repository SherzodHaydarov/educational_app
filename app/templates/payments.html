{% extends "base.html" %}

{% block content %}
<h2 class="mb-3">Payment Management</h2>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Create Payment</h5>
        <form id="payment-form" class="vstack gap-2">
          <select class="form-select" id="payment-student" required>
            <option value="">Select Student</option>
          </select>
          <select class="form-select" id="payment-course" required>
            <option value="">Select Course</option>
          </select>
          <button class="btn btn-primary" type="submit">Generate Payment QR</button>
        </form>
      </div>
    </div>

    <div class="card mt-3">
      <div class="card-body text-center">
        <h5 class="card-title">QR Code</h5>
        <img id="payment-qr" class="img-fluid d-none border rounded p-2" alt="Payment QR" />
        <p class="text-muted small mt-2" id="payment-qr-payload"></p>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Payments</h5>
        <p class="text-muted">Use "Mark Paid" to simulate successful payment processing.</p>
        <div class="table-responsive">
          <table class="table table-striped" id="payments-table">
            <thead><tr><th>ID</th><th>Student</th><th>Course</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="payments-alert" class="mt-3"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/payments.js"></script>
{% endblock %}
