<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kirish — EduCenter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0d0f14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(99,102,241,0.07) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      background: #161920;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      animation: fadeUp 0.4s cubic-bezier(0.34,1.2,0.64,1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-dot {
      width: 10px; height: 10px;
      background: #6366f1;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.2);
    }

    .logo-text {
      font-size: 16px;
      font-weight: 700;
      color: #f1f3f9;
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f1f3f9;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #1e2130;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #f1f3f9;
      font-size: 14px;
      font-family: inherit;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #4b5563; }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    /* Parol maydoni wrapper */
    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 44px;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #4b5563;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      border-radius: 4px;
    }

    .eye-btn:hover { color: #9ca3af; }

    .eye-btn svg {
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #fca5a5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    button[type="submit"]:hover {
      background: #4f46e5;
      box-shadow: 0 4px 14px rgba(99,102,241,0.35);
    }

    button[type="submit"]:active { transform: scale(0.98); }

    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-dot"></div>
      <span class="logo-text">EduCenter</span>
    </div>

    <h1>Xush kelibsiz</h1>
    <p class="subtitle">Davom etish uchun tizimga kiring.</p>

    {% if error %}
    <div class="error-box">
      <span>⚠</span> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="username">Foydalanuvchi nomi</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="admin"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="field">
        <label for="password">Parol</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="eye-btn" onclick="togglePassword()" id="eye-btn" aria-label="Parolni ko'rsatish">
            <!-- Ko'z ikonkasi — yopiq holat (default) -->
            <svg id="icon-hide" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            <!-- Ko'z ikonkasi — ochiq holat -->
            <svg id="icon-show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="display:none;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit">Kirish →</button>
    </form>

    <p class="footer-note">Bright Future Educational Center</p>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('password');
      const iconHide = document.getElementById('icon-hide');
      const iconShow = document.getElementById('icon-show');

      if (input.type === 'password') {
        input.type = 'text';
        iconHide.style.display = 'none';
        iconShow.style.display = 'block';
      } else {
        input.type = 'password';
        iconHide.style.display = 'block';
        iconShow.style.display = 'none';
      }
    }
  </script>
</body>
</html>
