{% extends "base.html" %}

{% block content %}
<h2 class="mb-3">Student Management</h2>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Add / Edit Student</h5>
        <form id="student-form" class="vstack gap-2">
          <input type="hidden" id="student-id" />
          <input class="form-control" id="student-first-name" placeholder="First name" required />
          <input class="form-control" id="student-last-name" placeholder="Last name" required />
          <input class="form-control" id="student-email" type="email" placeholder="Email" required />
          <input class="form-control" id="student-phone" placeholder="Phone" required />
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save Student</button>
            <button class="btn btn-secondary" id="student-reset" type="button">Clear</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Students</h5>
        <div class="table-responsive">
          <table class="table table-striped" id="students-table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<h2 class="mt-5 mb-3">Teacher Management</h2>
<div class="row g-4">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Add / Edit Teacher</h5>
        <form id="teacher-form" class="vstack gap-2">
          <input type="hidden" id="teacher-id" />
          <input class="form-control" id="teacher-first-name" placeholder="First name" required />
          <input class="form-control" id="teacher-last-name" placeholder="Last name" required />
          <input class="form-control" id="teacher-email" type="email" placeholder="Email" required />
          <input class="form-control" id="teacher-specialization" placeholder="Specialization" required />
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save Teacher</button>
            <button class="btn btn-secondary" id="teacher-reset" type="button">Clear</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Teachers</h5>
        <div class="table-responsive">
          <table class="table table-striped" id="teachers-table">
            <thead><tr><th>Name</th><th>Email</th><th>Specialization</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="students-alert" class="mt-3"></div>
{% endblock %}

{% block scripts %}
<script src="/static/js/students.js"></script>
{% endblock %}
