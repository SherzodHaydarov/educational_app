{% extends "base.html" %}

{% block content %}

<div class="page-header">
  <h2>Course Management</h2>
  <p>Kurslarni qo'shish, narx va davomiyligini boshqarish.</p>
</div>

<div class="row g-3">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-body">
        <p class="section-label">Kurs</p>
        <h5 class="card-title">Qo'shish / Tahrirlash</h5>
        <form id="course-form" class="vstack gap-2">
          <input type="hidden" id="course-id" />
          <input class="form-control" id="course-title" placeholder="Kurs nomi" required />
          <textarea class="form-control" id="course-description" placeholder="Tavsif (ixtiyoriy)"></textarea>
          <input class="form-control" id="course-price" type="number" min="1" step="0.01" placeholder="Narxi ($)" required />
          <input class="form-control" id="course-duration" type="number" min="1" placeholder="Davomiyligi (haftalar)" required />
          <div class="d-flex gap-2 mt-1">
            <button class="btn btn-primary flex-grow-1" type="submit">Saqlash</button>
            <button class="btn btn-secondary" id="course-reset" type="button">Tozalash</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <p class="section-label">Ro'yxat</p>
        <h5 class="card-title">Kurslar</h5>
        <div class="table-responsive">
          <table class="table" id="courses-table">
            <thead>
              <tr>
                <th>Nomi</th>
                <th>Narxi</th>
                <th>Davomiyligi</th>
                <th>Amallar</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="courses-alert" class="mt-3"></div>

{% endblock %}

{% block scripts %}
<script src="/static/js/courses.js"></script>
{% endblock %}
